<body>
    <script>
let arr =[10,6,8,4,9]
let largest=arr[0]
let second=arr[1]

for(let i=1;i<arr.length;i++){
    if(arr[i]>largest){
        second=largest
        largest=arr[i]
    }
    if(arr[i]<largest && arr[i]>second){
        second=arr[i]
    }
}
console.log(largest);
console.log(second);
    </script>
</body>
